name: Release

# npm Trusted Publishing binds this exact workflow filename to the package.
# Update the npm-side configuration before renaming this file.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install Trusted-Publishing-capable npm
        run: npm install --global npm@11.19.1
      - name: Verify tag matches package version
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          const expected = 'v' + pkg.version;
          if (process.env.GITHUB_REF_NAME !== expected) {
          console.error('Expected tag ' + expected); process.exit(1); }"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm check
      - name: Publish
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
